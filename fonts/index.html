<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>字体收藏</title>
    <style>
        @font-face {
            font-family: 'QuartzRegular';
            src: url('./fonts/QuartzRegular.ttf');
        }
        @font-face {
            font-family: 'YouSheBiaoTiHei';
            src: url('./fonts/YouSheBiaoTiHei.ttf');
        }
        @font-face {
            font-family: 'AiDeep';
            src: url('./fonts/AiDeep.otf');
        }
        @font-face {
            font-family: 'DIN-BoldAlternate';
            src: url('./fonts/DIN-BoldAlternate.otf');
        }
        @font-face {
            font-family: 'FZZhengHeiS-DB-GB';
            src: url('./fonts/FZZhengHeiS-DB-GB.ttf');
        }
        @font-face {
            font-family: 'HuXiaoBoNanShenTi';
            src: url('./fonts/HuXiaoBoNanShenTi.otf');
        }
        @font-face {
            font-family: 'PangMenZhengDaoBiaoTiTi';
            src: url('./fonts/PangMenZhengDaoBiaoTiTi.ttf');
        }


    </style>
    <style>

        ul{
            font-size: 2em;
        }
        .font{
            color: #00ffe1;
        }
        .font1{
            font-family: 'QuartzRegular';
        }
        .YouSheBiaoTiHei{
            font-family: 'YouSheBiaoTiHei';
        }
        .AiDeep{
            font-family: 'AiDeep';
        }
        .DIN-BoldAlternate{
            font-family: 'DIN-BoldAlternate';
        }
        .FZZhengHeiS-DB-GB{
            font-family: 'FZZhengHeiS-DB-GB';
        }
        .HuXiaoBoNanShenTi{
            font-family: 'HuXiaoBoNanShenTi';
        }
        .PangMenZhengDaoBiaoTiTi{
            font-family: 'PangMenZhengDaoBiaoTiTi';
        }
    </style>
</head>
<body>
<ul>
    <li>液晶字体 <a href="./fonts/QuartzRegular.ttf"><span class="font font1">12451ww测试</span></a></li>
    <li>YouSheBiaoTiHei字体 <a href="./fonts/YouSheBiaoTiHei.ttf"><span class="font YouSheBiaoTiHei">12451ww测试</span></a></li>
    <li>AiDeep 字体 <a href="./fonts/AiDeep.otf"><span class="font AiDeep">12451ww测试</span></a></li>
    <li>DIN-BoldAlternate 字体 <a href="./fonts/DIN-BoldAlternate.otf"><span class="font DIN-BoldAlternate">12451ww测试</span></a></li>
    <li>FZZhengHeiS-DB-GB 字体 <a href="./fonts/FZZhengHeiS-DB-GB.ttf"><span class="font FZZhengHeiS-DB-GB">12451ww测试</span></a></li>
    <li>HuXiaoBoNanShenTi 字体 <a href="./fonts/HuXiaoBoNanShenTi.otf"><span class="font HuXiaoBoNanShenTi">12451ww测试</span></a></li>
    <li>PangMenZhengDaoBiaoTiTi 字体 <a href="./fonts/PangMenZhengDaoBiaoTiTi.ttf"><span class="font PangMenZhengDaoBiaoTiTi">12451ww测试</span></a></li>
</ul>

</body>
</html>
